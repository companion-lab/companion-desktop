<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>companion</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        font-family: system-ui, sans-serif;
        color: white;
      }
      /* Main-window theme tokens. Defaults match the historical hardcoded
       * colors; the user's accent preference overrides --c-accent at runtime
       * (see src/theme.ts). Components read them with the same fallbacks. */
      :root {
        --c-accent: #8ab4f8;
        --c-text: white;
        --c-panel-bg: rgba(255, 255, 255, 0.04);
        --c-input-bg: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
