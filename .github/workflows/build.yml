# Build the companion app for macOS, Windows and Linux and publish a
# GitHub Release with one installer zip per platform on v* tags.
#
# Bundled plugins are NOT built here. Each plugin repo
# (companion-lab/companion-plugin-*) publishes ready-made per-platform zips
# as GitHub Release assets on its v* tags, and this workflow only downloads
# them into src-tauri/resources/plugins (tauri.conf bundle.resources ships
# everything under "resources"). That keeps the app build to a single cargo
# compile + frontend build per platform instead of recompiling every plugin
# backend and re-downloading ~500 MB of models.
#
# Plugin versions are pinned below in PLUGIN_VERSIONS. To ship a plugin
# update, bump its entry once the plugin repo has published its tag.
#
# Known gaps (by design, not accidents):
#   - vision is not bundled: companion-plugin-vision has no release tag yet.
#     Add it to PLUGIN_VERSIONS + the matrix plugin lists once it publishes.
#   - stt on Windows: no windows-x86_64 asset is published upstream yet
#     (the windows sidecar support was reverted upstream). stt is listed in
#     the windows leg as optional, so the build warns and ships without it
#     until the asset lands, then bundles it with no workflow changes.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned release tag per bundled plugin repo (companion-lab/companion-plugin-<id>).
  PLUGIN_VERSIONS: |
    alarms=v0.1.0
    calendar=v0.1.0
    chat=v0.1.0
    mcp=v0.1.0
    stt=v0.1.1
    tts=v0.1.0
    vrm=v0.1.0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: that is the only macOS target published.
          - os: macos-latest
            platform: macos-arm64
            plugins: "alarms calendar chat mcp stt tts vrm"
          # Oldest supported runner: keeps the bundled binaries' glibc
          # requirement low for end-user distros.
          - os: ubuntu-22.04
            platform: linux-x86_64
            plugins: "alarms calendar chat mcp stt tts vrm"
            tauri_args: "--bundles deb"
          - os: windows-latest
            platform: windows-x86_64
            plugins: "alarms calendar chat mcp stt tts vrm"
            # stt has no windows release asset yet; skip it with a warning
            # until upstream publishes one (then it is bundled automatically).
            optional_plugins: "stt"
    runs-on: ${{ matrix.os }}
    # Developer ID + notarization credentials for the macOS leg. Each is
    # optional: if any is unset the macOS build falls back to the ad-hoc
    # signingIdentity from tauri.conf.json, same as the pre-signing builds.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH_B64: ${{ secrets.APPLE_API_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4

      # Release zips contain <plugin-id>/manifest.json + frontend + backend
      # lib + assets (models included) at a single top-level folder, which is
      # exactly the layout bundled plugins live in. Frontend-only plugins
      # (chat) ship one universal zip without the platform suffix.
      - name: Download bundled plugins from their release tags
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PLUGINS: ${{ matrix.plugins }}
          OPTIONAL_PLUGINS: ${{ matrix.optional_plugins }}
        run: |
          set -euo pipefail
          out="src-tauri/resources/plugins"
          mkdir -p "$out"
          tmp="plugin-download.zip"
          for plugin in $PLUGINS; do
            tag=$(printf '%s\n' "$PLUGIN_VERSIONS" | grep "^${plugin}=" | cut -d= -f2)
            [ -n "$tag" ] || { echo "::error::no pinned version for plugin '${plugin}' in PLUGIN_VERSIONS"; exit 1; }
            ver="${tag#v}"
            base="https://github.com/companion-lab/companion-plugin-${plugin}/releases/download/${tag}"
            zip_name="${plugin}-${ver}-${PLATFORM}.zip"
            if ! curl -fsSL --retry 3 -o "$tmp" "${base}/${zip_name}"; then
              # Frontend-only plugins ship one universal zip without a
              # platform suffix; fall back to that naming.
              zip_name="${plugin}-${ver}.zip"
              if ! curl -fsSL --retry 3 -o "$tmp" "${base}/${zip_name}"; then
                # Plugins listed as optional for this platform (e.g. stt on
                # windows, asset not published upstream yet) are skipped with
                # a visible warning instead of failing the build.
                if printf '%s' "$OPTIONAL_PLUGINS" | grep -qw "$plugin"; then
                  echo "::warning::skipping optional plugin '${plugin}': no release asset for ${tag} on ${PLATFORM} (tried ${plugin}-${ver}-${PLATFORM}.zip and ${plugin}-${ver}.zip)"
                  rm -f "$tmp"
                  continue
                fi
                echo "::error::no release asset for ${plugin} ${tag} on ${PLATFORM} (tried ${plugin}-${ver}-${PLATFORM}.zip and ${plugin}-${ver}.zip)"
                exit 1
              fi
            fi
            case "$RUNNER_OS" in
              Windows) 7z x -y -o"$out" "$tmp" > /dev/null ;;
              *)       unzip -q -o "$tmp" -d "$out" ;;
            esac
            [ -f "$out/${plugin}/manifest.json" ] \
              || { echo "::error::${zip_name} did not contain ${plugin}/manifest.json"; exit 1; }
            echo "bundled ${plugin} ${tag} (${zip_name})"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      # Only the app's own crate compiles here; plugin backends ship prebuilt
      # inside the downloaded release zips.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.VERSION.replace(/^v/, '');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      # macOS Developer ID signing + notarization (hardened runtime is on by
      # default in Tauri v2). The bundler reads APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD and builds its own temporary keychain from
      # the p12 — no manual keychain import here — then signs during the
      # build; APPLE_API_* make it notarize + staple in the same run. When the
      # secrets are not configured, the plain build below keeps the ad-hoc
      # signingIdentity from tauri.conf.json ("-").
      - name: Write App Store Connect API key
        if: env.APPLE_API_KEY_PATH_B64 != ''
        env:
          APPLE_API_KEY_PATH_B64: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_PATH_B64" | base64 --decode > "$path"
          echo "APPLE_API_KEY_PATH=$path" >> "$GITHUB_ENV"
          echo "wrote API key ($(wc -c < "$path") bytes)"

      - name: Build the app
        if: runner.os != 'MacOS' || env.APPLE_CERTIFICATE == ''
        run: pnpm tauri build ${{ matrix.tauri_args }}

      - name: Build the app (Developer ID signed + notarized)
        if: runner.os == 'MacOS' && env.APPLE_CERTIFICATE != ''
        run: >-
          pnpm tauri build
          --config '{"bundle":{"macOS":{"signingIdentity":"Developer ID Application"}}}'
          ${{ matrix.tauri_args }}

      - name: Verify macOS signing
        if: runner.os == 'MacOS' && env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          app_path="src-tauri/target/release/bundle/macos/companion.app"
          codesign --verify --strict --verbose=2 "$app_path"
          # The bundler notarizes and staples synchronously inside the build,
          # so Gatekeeper must accept the app here and now.
          spctl --assess --type exec -vv "$app_path" 2>&1
          spctl --assess --type exec -vv "$app_path" 2>&1 | grep -q 'accepted' \
            || { echo "::error::macOS app is not Gatekeeper-accepted"; exit 1; }

      # The bundled plugins must actually ship inside the produced installers:
      # Tauri preserves the config-relative path, so bundle.resources
      # ["resources"] lands them at <resource_dir>/resources/plugins
      # (macOS Contents/Resources/resources/plugins, deb
      # /usr/lib/companion/resources/plugins). A missing package here would
      # mean first installs boot with no default features.
      # Windows is not verified: NSIS/MSI contents cannot be listed reliably
      # here; the download step already verifies the staging dir the bundler
      # packs, and the resource layout is the same mechanism as macOS/deb.
      - name: Verify bundled plugins in the built artifacts
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLUGINS: ${{ matrix.plugins }}
          OPTIONAL_PLUGINS: ${{ matrix.optional_plugins }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            MacOS)
              root="src-tauri/target/release/bundle/macos/companion.app/Contents/Resources/resources/plugins"
              ;;
            Linux)
              deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
              dpkg-deb -x "$deb" deb-root
              root="deb-root/usr/lib/companion/resources/plugins"
              ;;
            *)
              echo "::error::unexpected runner os '$RUNNER_OS'"; exit 1 ;;
          esac
          for plugin in $PLUGINS; do
            if printf '%s' "$OPTIONAL_PLUGINS" | grep -qw "$plugin"; then
              continue
            fi
            [ -f "$root/$plugin/manifest.json" ] \
              || { echo "::error::built artifact is missing bundled plugin '$plugin' (expected $root/$plugin/manifest.json)"; exit 1; }
            echo "artifact contains bundled plugin: $plugin"
          done

      # One zip per platform, installers flat at its root:
      #   macos-arm64 -> .dmg | windows-x86_64 -> .msi + setup .exe
      #   linux-x86_64 -> .deb + .rpm + .AppImage
      - name: Zip installers
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          staging="installers"
          mkdir -p "$staging"
          find src-tauri/target/release/bundle -type f \( \
            -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} "$staging/" \;
          count=$(ls -1 "$staging" | wc -l | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "::error::no installers found under src-tauri/target/release/bundle"; exit 1; }
          echo "packing ${count} installer(s): $(ls -1 "$staging" | tr '\n' ' ')"
          cd "$staging"
          zip_path="../companion-${version}-${PLATFORM}.zip"
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "$zip_path" . > /dev/null ;;
            *)       zip -q -r "$zip_path" . ;;
          esac
          ls -la "$zip_path"

      - name: Upload platform zip
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.platform }}
          path: companion-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          merge-multiple: true
          path: dist

      # Published (not a draft): drafts are maintainer-only in the UI and
      # invisible on the tag page, which caused empty-looking releases.
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*.zip
