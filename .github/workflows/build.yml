# Build the companion app with the default plugins bundled (all plugins
# except l2d) for macOS, Windows and Linux, and publish installers to a draft
# GitHub Release on v* tags.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: the stt plugin's moonshine native lib has no
          # macos-x86_64 prebuilt (moonshine-sys/build.rs panics on it).
          - os: macos-latest
          # Oldest supported runner: keeps the bundled binaries' glibc
          # requirement low for end-user distros.
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      # bindgen (companion-plugin-stt/moonshine-sys) needs libclang; Windows
      # runners ship LLVM here. Empty on macOS/Linux, where libclang is
      # auto-detected. (The runner context is unavailable in job-level env,
      # so matrix.os is used instead.)
      LIBCLANG_PATH: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\LLVM\bin' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout default plugins
        shell: bash
        run: |
          mkdir -p plugin-repos
          for plugin in alarms calendar chat mcp stt tts vrm; do
            git clone --depth 1 \
              "https://github.com/companion-lab/companion-plugin-${plugin}.git" \
              "plugin-repos/companion-plugin-${plugin}"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugin-repos/companion-plugin-alarms/backend
            plugin-repos/companion-plugin-calendar/backend
            plugin-repos/companion-plugin-chat/backend
            plugin-repos/companion-plugin-mcp/backend
            plugin-repos/companion-plugin-stt/backend
            plugin-repos/companion-plugin-tts/backend
            plugin-repos/companion-plugin-vrm/backend

      # Big downloaded prerequisites for the stt/tts plugin packages
      # (~500 MB combined; the download scripts skip existing files).
      - name: Cache downloaded plugin assets
        uses: actions/cache@v4
        with:
          path: |
            plugin-repos/companion-plugin-stt/moonshine-sys/lib
            plugin-repos/companion-plugin-stt/assets
            plugin-repos/companion-plugin-tts/assets
          key: companion-plugin-assets-${{ runner.os }}-v1

      - name: Build default plugins
        shell: bash
        run: bash scripts/build-all-plugins.sh --backend --out src-tauri/resources/plugins

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.VERSION.replace(/^v/, '');fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: Build the app
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**
