[package]
name = "companion"
version = "0.0.0"
description = "VRM desktop companion"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2"
# Official Model Context Protocol SDK (client role only).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
companion-plugin-sdk = "0.1"
libloading = "0.9.0"
zip = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# objc2: transparent-window setup in lib.rs. Mic permission (TCC) lives in
# the stt plugin backend now (features/stt/backend/src/mic_permission.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSApplication"] }
libc = "0.2"

[profile.release]
# Startup matters more than peak throughput for a desktop companion: thin
# LTO + one codegen unit shrink the binary (better instruction cache at
# boot); strip drops symbol tables. Mirrors the voice backend crate.
lto = "thin"
codegen-units = 1
strip = true
