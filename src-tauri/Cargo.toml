[package]
name = "companion"
version = "0.5.0"
description = "VRM desktop companion"
authors = ["Companion Lab"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2"
# Official Model Context Protocol SDK (client role only).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
# stream: plugin:http|fetch re-implementation in the web bridge streams
# response bodies (chat SSE) instead of buffering them whole.
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
bytes = "1"
# reopen: opens the downloaded update installer with the OS handler.
tauri-plugin-opener = "2"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
companion-plugin-sdk = "0.4"
libloading = "0.9.0"
zip = "2"

# Web bridge (web_bridge/): an HTTP + WebSocket server inside the app process
# that serves the built frontend at /app and carries the Tauri IPC contract to
# browsers while the desktop app hosts the real backend. axum ws is the
# transport; tokio/futures-util power the server and streamed fetch bodies;
# rand generates the access token for COMPANION_WEB_LAN mode.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# if-addrs: enumerate the machine's IPv4 interfaces for the Web App settings
# section (a default-route probe alone picks VPN tunnels over the real LAN).
if-addrs = "0.13"
rand = "0.8"

# cursor_window_local/cursor_global (Win32 + X11 probe): map the raw window
# handle to its HWND (Windows) or X11 window ID (Linux).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# cursor_global's X11 probe: x11-dl dlopens libX11 at runtime, so a missing
# dev package or a Wayland-only session degrades to None instead of failing
# to start the app.
x11-dl = "2.21"
# Wayland click-through (click_through.rs): drive the GTK input shape
# directly — tao's set_ignore_cursor_events never reaches the compositor
# in WebKitGTK windows. Same versions tao itself pulls in, so no new
# lockfile entries.
gtk = "0.18"
cairo-rs = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# objc2: transparent-window setup in lib.rs. Mic permission (TCC) lives in
# the stt plugin backend now (features/stt/backend/src/mic_permission.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSGeometry", "NSString"] }
# NSMenu/NSMenuItem: dock_menu.rs (Dock icon right-click menu).
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSApplication", "NSMenu", "NSMenuItem"] }
libc = "0.2"

[profile.release]
# Startup matters more than peak throughput for a desktop companion: thin
# LTO + one codegen unit shrink the binary (better instruction cache at
# boot); strip drops symbol tables. Mirrors the voice backend crate.
lto = "thin"
codegen-units = 1
strip = true
